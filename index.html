<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmet Yıldırım</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main>
	<header>ahmet yıldırım</header>
	<div class="btn-block">
		<a id="github" class="icon-btn icon-btn--github" href="https://github.com/yldrmahmet" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
			<img class="icon icon--github" src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/github.svg" alt="" />
		</a>
		GitHub
	</div>
	<div class="btn-block">
		<a id="linkedin" class="icon-btn icon-btn--linkedin" href="https://www.linkedin.com/in/yldrmahmet/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
			<img class="icon icon--linkedin" src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/linkedin.svg" alt="" />
		</a>
		LinkedIn
	</div>
	<div class="btn-block">
		<a id="cv" class="icon-btn icon-btn--cv" href="./cv.pdf" target="_blank" rel="noopener noreferrer" aria-label="CV" data-cv-open>
			<img class="icon icon--cv" src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/icons/filetype-pdf.svg" alt="" />
		</a>
		CV
	</div>
	<footer></footer>
	</main>
	<div id="cv-modal" class="cv-modal" role="dialog" aria-modal="true" aria-label="CV preview" aria-hidden="true">
		<div class="cv-modal__panel">
			<iframe src="./cv.pdf#view=FitH" class="cv-modal__frame" title="CV PDF Preview"></iframe>
		</div>
	</div>
	<script src="./app.js"></script>
</body>
</html>
