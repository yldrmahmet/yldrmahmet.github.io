<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmet Yıldırım</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main>
	<header>ahmet yıldırım</header>
	<div class="btn-block">
		<a id="github" class="icon-btn icon-btn--github" href="https://github.com/yldrmahmet" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
			<svg class="icon icon--github" viewBox="0 0 24 24" width="24px" height="24px" aria-hidden="true">
				<g fill="none" stroke="#fff">
					<circle class="icon__part icon__part--1" cx="12" cy="12" r="9" stroke-width="2" data-anim-end />
					<circle class="icon__part icon__part--2" cx="8" cy="8" r="1.6" stroke-width="2" />
					<circle class="icon__part icon__part--3" cx="16" cy="16" r="1.6" stroke-width="2" />
					<line class="icon__part icon__part--4" x1="9.2" y1="9.2" x2="14.8" y2="14.8" stroke-width="2" stroke-linecap="round" />
				</g>
			</svg>
		</a>
		<span class="btn-block__u">G</span>itHub
	</div>
	<div class="btn-block">
		<a id="linkedin" class="icon-btn icon-btn--linkedin" href="https://www.linkedin.com/in/kullaniciadi/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
			<svg class="icon icon--linkedin" viewBox="0 0 24 24" width="24px" height="24px" aria-hidden="true">
				<g fill="none" stroke="#fff">
					<rect class="icon__part icon__part--1" x="4" y="4" width="16" height="16" rx="2" stroke-width="2" data-anim-end />
					<circle class="icon__part icon__part--2" cx="8" cy="9" r="1" stroke-width="2" />
					<line class="icon__part icon__part--3" x1="8" y1="11" x2="8" y2="16" stroke-width="2" stroke-linecap="round" />
					<path class="icon__part icon__part--4" d="M12 16v-3c0-1.1.9-2 2-2s2 .9 2 2v3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
				</g>
			</svg>
		</a>
		<span class="btn-block__u">L</span>inkedIn
	</div>
	<div class="btn-block">
		<a id="cv" class="icon-btn icon-btn--cv" href="./cv.pdf" target="_blank" rel="noopener noreferrer" aria-label="CV">
			<svg class="icon icon--cv" viewBox="0 0 24 24" width="24px" height="24px" aria-hidden="true">
				<g fill="none" stroke="#fff">
					<path class="icon__part icon__part--1" d="M7 3h8l4 4v14H7z" stroke-width="2" stroke-linejoin="round" data-anim-end />
					<polyline class="icon__part icon__part--2" points="15,3 15,7 19,7" stroke-width="2" stroke-linejoin="round" />
					<line class="icon__part icon__part--3" x1="9" y1="12" x2="17" y2="12" stroke-width="2" stroke-linecap="round" />
					<line class="icon__part icon__part--4" x1="9" y1="15" x2="15" y2="15" stroke-width="2" stroke-linecap="round" />
				</g>
			</svg>
		</a>
		<span class="btn-block__u">C</span>V
	</div>
	<footer></footer>
		</main>
        <script src="./app.js"></script>
</body>
</html>
