<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Page Not Found - Ahmet Yıldırım</title>
	<meta name="robots" content="noindex">
	<link rel="icon" type="image/svg+xml" href="/favicon.svg">
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }
		body {
			align-items: center;
			background-image: linear-gradient(135deg, hsl(214,64%,67%) 0%, hsl(221,67%,60%) 52%, hsl(227,61%,54%) 100%);
			display: flex;
			font: 14px/1.5 Verdana, Arial, sans-serif;
			justify-content: center;
			min-height: 100vh;
			padding: 1rem;
		}
		.window {
			background: #ece9d8;
			border: 1px solid #0831d9;
			border-radius: 8px 8px 0 0;
			box-shadow: 0 0.3em 0.7em rgba(10, 20, 60, 0.35);
			max-width: 26rem;
			overflow: hidden;
			width: 100%;
		}
		.title-bar {
			background: linear-gradient(180deg, #0997ff 0%, #0053ee 9%, #0050ee 18%, #0066ff 92%);
			color: #fff;
			font-weight: 700;
			padding: 0.45rem 0.7rem;
			text-shadow: 1px 1px #18205e;
		}
		.body { padding: 1rem; }
		.body p + p { margin-top: 0.6rem; }
		a { color: #0645ad; }
	</style>
</head>
<body>
	<div class="window">
		<div class="title-bar">Error - Page Not Found</div>
		<div class="body">
			<p><strong>404:</strong> The page you are looking for does not exist on this desktop.</p>
			<p>Go back to <a href="https://yldrmahmet.github.io/">yldrmahmet.github.io</a>.</p>
		</div>
	</div>
</body>
</html>
